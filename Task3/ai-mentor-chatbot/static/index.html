<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentor Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header>
            <h1>AI Mentor Chatbot</h1>
            <p class="subtitle">Your AI/ML career learning guide</p>
        </header>

        <!-- Chat messages -->
        <div id="chat-container" role="log" aria-live="polite"></div>

        <!-- Input area -->
        <div id="input-area">
            <input
                type="text"
                id="message-input"
                placeholder="Ask me anything about learning AI..."
                autocomplete="off"
            />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
